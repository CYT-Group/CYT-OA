server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 浏览器只访问本容器，接口由容器内网转发；同源，不需要 CORS 白名单
    location /api/ {
        proxy_pass http://api:48081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin-api/ {
        proxy_pass http://api:48081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 接口文档也走后端，方便在测试服直接看 /swagger-ui.html
    location ~ ^/(swagger-ui|swagger-resources|v3/api-docs|webjars)/ {
        proxy_pass http://api:48081;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?|map)$ {
        try_files $uri =404;
        expires 7d;
    }

    # Vue Router history 模式：刷新子路由回退到首页
    location / {
        try_files $uri $uri/ /index.html;
    }
}
