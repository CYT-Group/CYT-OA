# CYT-OA 测试服编排（1Panel「容器 → 编排」/ docker compose 通用）
#
# 四个容器：db（OA 专用 MySQL 8）+ redis（OA 专用缓存）+ api（Spring Boot）+ web（nginx 托管的 Vue SPA）。
# 浏览器只访问 web 的 8091；/api 与 /admin-api 由 web 在容器内网反代到 api，不经过宿主机。
# 数据库和缓存都是独立容器/独立卷，不碰 CS、Common、Portal 的现有数据。
#
# 真实口令放在同目录 .env（0600，不入库），初次部署先跑 db-init.sh 灌建表脚本。
# 健康检查：curl -I http://127.0.0.1:8091/   +   /api/auth/login 用 admin 登录。

services:
  db:
    image: mysql:8.0
    container_name: cyt-oa-db
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cyt_oa_center}
      MYSQL_USER: ${MYSQL_USER:-cyt_oa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里配置 MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+08:00
    volumes:
      - oa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  redis:
    image: redis:8.10.2
    container_name: cyt-oa-redis
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1"]
    volumes:
      - oa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${OA_API_IMAGE:-192.168.1.182:5000/cyt-oa-api:latest}
    container_name: cyt-oa-api
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 显式指定 test：不要用默认 local profile，避免误读本机 application-local.yml
      SPRING_PROFILES_ACTIVE: test
      CYT_CENTER_PORT: "48081"
      CYT_MYSQL_HOST: db
      CYT_MYSQL_PORT: "3306"
      CYT_MYSQL_DATABASE: ${MYSQL_DATABASE:-cyt_oa_center}
      CYT_MYSQL_USERNAME: ${MYSQL_USER:-cyt_oa}
      CYT_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 里配置 MYSQL_PASSWORD}
      CYT_REDIS_HOST: redis
      CYT_REDIS_PORT: "6379"
      CYT_REDIS_DATABASE: "0"
      CYT_REDIS_PASSWORD: ""
      # 测试服：用 system-seed.sql 自带的 admin / admin123 登录，不接企微、不接门户 SSO
      CYT_PASSWORD_LOGIN_ENABLED: "true"
      CYT_DEV_IDENTITY_ENABLED: "false"
      CYT_DIRECTORY_SYNC_ENABLED: "false"
      CYT_WECOM_HR_SYNC_ENABLED: "false"
      CYT_SSO_ENABLED: "false"
      CYT_WECOM_GATEWAY_URL: ""
    ports:
      - "127.0.0.1:${OA_API_PORT:-8092}:48081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/48081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  web:
    image: ${OA_WEB_IMAGE:-192.168.1.182:5000/cyt-oa-web:latest}
    container_name: cyt-oa-web
    pull_policy: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OA_WEB_PORT:-8091}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  oa_mysql:
  oa_redis:
